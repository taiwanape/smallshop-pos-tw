name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:site
      - run: pnpm build:cloudflare
      - run: pnpm check:cloudflare
      - uses: actions/upload-artifact@v4
        with:
          name: daily-tools-site
          path: out
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: daily-tools-cloudflare
          path: dist-cloudflare
          retention-days: 7
